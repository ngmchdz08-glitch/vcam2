name: Build Vcam_Mch for RootHide

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos
          submodules: recursive
          
      - name: Install Dependencies
        run: |
          brew install ldid xz dpkg
          
      - name: Build Tweak
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          make package ROOTLESS=1 ROOTHIDE=1
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vcam_Mch_RootHide
          path: packages/*.deb
